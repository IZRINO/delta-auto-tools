[package]
name = "delta-auto-tools"
version = "0.18.0-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "delta_auto_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
regex = "1.12.4"
reqwest = { version = "0.12.28", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
xcap = "0.9.6"
enigo = "0.6.1"
image = "0.25.10"
willhook = "0.6.3"
crossbeam-channel = "0.5"
rodio = "0.20"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
