[package]
name = "delta-auto-tools"
version = "0.10.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "delta_auto_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
xcap = "0.9.4"
enigo = "0.6.1"
image = "0.25"
willhook = "0.6.3"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
