[package]
name = "delta-auto-tools"
version = "0.19.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "delta_auto_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "delta-auto-tools"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
xcap = "0.9.6"
enigo = "0.6.1"
image = "0.25.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
uuid = { version = "1.23.4", features = ["v4"] }
willhook = "0.6.3"
crossbeam-channel = "0.5"
rodio = "0.20"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
windows = { version = "0.61.3", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
tokio = { version = "1.52.3", features = ["test-util"] }
