<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>达尔文.skill - Core Loop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1200px;
            height: 500px;
            background: #111111;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
<svg height="500" width="1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrow markers -->
        <marker id="arr-orange" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
            <polygon fill="#D4532B" points="0 0, 10 3.5, 0 7"/>
        </marker>
        <marker id="arr-green" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
            <polygon fill="#2B8A3E" points="0 0, 10 3.5, 0 7"/>
        </marker>
        <marker id="arr-red" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
            <polygon fill="#C92A2A" points="0 0, 10 3.5, 0 7"/>
        </marker>
        <marker id="arr-orange-up" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
            <polygon fill="#D4532B" points="0 0, 10 3.5, 0 7"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect fill="#111111" height="500" width="1200"/>

    <!-- CORE LOOP label -->
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3" x="48"
          y="50">CORE LOOP
    </text>

    <!--
      Layout plan (y-center = 200):
      Block width = 120, height = 70
      Gap between blocks = 36 (arrow)
      Decision diamond: center at x=750, size 90×90

      Blocks horizontal positions (left edge):
      B1 EVALUATE:  x=48,  center=108
      B2 IMPROVE:   x=228, center=288
      B3 VALIDATE:  x=408, center=468
      B4 CONFIRM:   x=588, center=648
      Diamond:      center=790
      YES block:    x=958, center=1018  (top, y=145)
      NO block:     x=958, center=1018  (bottom, y=255)

      All vertical center: y=200
      YES block center y = 160
      NO block center y = 260
    -->

    <!-- ======================== -->
    <!-- MAIN PROCESS BLOCKS      -->
    <!-- ======================== -->

    <!-- B1: EVALUATE -->
    <rect fill="#FFFFFF" height="70" width="124" x="48" y="165"/>
    <text fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="110"
          y="196">EVALUATE
    </text>
    <text fill="#555555" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle" x="110"
          y="213">评估当前技能
    </text>

    <!-- Arrow B1→B2 -->
    <line marker-end="url(#arr-orange)" stroke="#D4532B" stroke-width="2" x1="172" x2="204" y1="200" y2="200"/>

    <!-- B2: IMPROVE -->
    <rect fill="#FFFFFF" height="70" width="124" x="210" y="165"/>
    <text fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="272"
          y="196">IMPROVE
    </text>
    <text fill="#555555" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle" x="272"
          y="213">生成改进方案
    </text>

    <!-- Arrow B2→B3 -->
    <line marker-end="url(#arr-orange)" stroke="#D4532B" stroke-width="2" x1="334" x2="366" y1="200" y2="200"/>

    <!-- B3: VALIDATE -->
    <rect fill="#FFFFFF" height="70" width="124" x="372" y="165"/>
    <text fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="434"
          y="196">VALIDATE
    </text>
    <text fill="#555555" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle" x="434"
          y="213">实测验证效果
    </text>

    <!-- Arrow B3→B4 -->
    <line marker-end="url(#arr-orange)" stroke="#D4532B" stroke-width="2" x1="496" x2="528" y1="200" y2="200"/>

    <!-- B4: CONFIRM -->
    <rect fill="#FFFFFF" height="70" width="124" x="534" y="165"/>
    <text fill="#111111" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="596"
          y="196">CONFIRM
    </text>
    <text fill="#555555" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle" x="596"
          y="213">人类确认结果
    </text>

    <!-- Arrow B4→Diamond -->
    <line marker-end="url(#arr-orange)" stroke="#D4532B" stroke-width="2" x1="658" x2="698" y1="200" y2="200"/>

    <!-- ======================== -->
    <!-- DECISION DIAMOND         -->
    <!-- center: 790, 200         -->
    <!-- size: 96×80              -->
    <!-- ======================== -->
    <polygon fill="#D4532B" points="790,152 838,200 790,248 742,200"/>
    <text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle" x="790"
          y="196">SCORE
    </text>
    <text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle" x="790"
          y="212">UP?
    </text>

    <!-- ======================== -->
    <!-- YES PATH (top branch)    -->
    <!-- ======================== -->

    <!-- YES PATH: diamond top → up → right to YES block -->
    <!-- Diamond top point: 790, 152 -->
    <path d="M790,152 L790,120 L954,120"
          fill="none" marker-end="url(#arr-green)" stroke="#2B8A3E" stroke-width="2"/>

    <!-- YES label -->
    <text fill="#2B8A3E" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle"
          x="860" y="113">YES
    </text>

    <!-- YES result block: KEEP / git commit -->
    <rect fill="#2B8A3E" height="70" width="130" x="960" y="85"/>
    <text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="1025"
          y="115">KEEP
    </text>
    <text fill="rgba(255,255,255,0.75)" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle"
          x="1025" y="133">git commit
    </text>

    <!-- ======================== -->
    <!-- NO PATH (bottom branch)  -->
    <!-- ======================== -->

    <!-- NO PATH: diamond bottom → down → right to NO block -->
    <!-- Diamond bottom point: 790, 248 -->
    <path d="M790,248 L790,280 L954,280"
          fill="none" marker-end="url(#arr-red)" stroke="#C92A2A" stroke-width="2"/>

    <!-- NO label -->
    <text fill="#C92A2A" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle"
          x="860" y="298">NO
    </text>

    <!-- NO result block: REVERT / git revert -->
    <rect fill="#C92A2A" height="70" width="130" x="960" y="245"/>
    <text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="1025"
          y="275">REVERT
    </text>
    <text fill="rgba(255,255,255,0.75)" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle"
          x="1025" y="293">git revert
    </text>

    <!-- ======================== -->
    <!-- LOOP BACK ARROW          -->
    <!-- from KEEP/REVERT → back to EVALUATE -->
    <!-- ======================== -->

    <!-- From right side of YES block (1090, 120) → right to 1155 → down to 420 → left to 48 → up to 200 (B1 left) -->
    <path d="M1090,120 L1155,120 L1155,420 L48,420 L48,235"
          fill="none" stroke="#D4532B" stroke-dasharray="6,4" stroke-width="2"/>

    <!-- Also from NO block right → join same vertical -->
    <path d="M1090,280 L1155,280"
          fill="none" stroke="#D4532B" stroke-dasharray="6,4" stroke-width="2"/>

    <!-- Arrow head pointing up at B1 left -->
    <polygon fill="#D4532B" points="42,236 54,236 48,222"/>

    <!-- LOOP BACK label along bottom -->
    <text fill="#444444" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle"
          x="590" y="448">LOOP BACK
    </text>

    <!-- ======================== -->
    <!-- STEP NUMBERS             -->
    <!-- ======================== -->
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="10" font-weight="700" x="48" y="158">01</text>
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="10" font-weight="700" x="210" y="158">02</text>
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="10" font-weight="700" x="372" y="158">03</text>
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="10" font-weight="700" x="534" y="158">04</text>
    <text fill="#D4532B" font-family="Inter, sans-serif" font-size="10" font-weight="700" opacity="0.9" x="762" y="145">
        05
    </text>

    <!-- ======================== -->
    <!-- SUBTITLE TEXT            -->
    <!-- ======================== -->
    <text fill="#333333" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1" x="48"
          y="476">达尔文.skill
    </text>
    <text fill="#333333" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="end"
          x="1152" y="476">CONTINUOUS IMPROVEMENT ENGINE
    </text>

</svg>
</body>
</html>
